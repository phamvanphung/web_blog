<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" role="img" aria-label="9ent logo">
  <title>9ent logo</title>
  <defs>
    <!-- Checker pattern used on the lower-right of the mark -->
    <pattern id="checker" x="0" y="0" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#cf6768"/>
      <rect width="4" height="4" fill="#8e211c"/>
      <rect x="4" y="4" width="4" height="4" fill="#8e211c"/>
    </pattern>
    <!-- Mask that turns the ring into a "9" with a checker bottom -->
    <mask id="nine-mask">
      <rect width="100" height="100" fill="black"/>
      <!-- Outer ring band -->
      <circle cx="50" cy="50" r="44" fill="white"/>
      <circle cx="50" cy="50" r="26" fill="black"/>
      <!-- Right stem that turns the O into a 9 -->
      <rect x="60" y="50" width="14" height="40" fill="white"/>
      <!-- Mask out the inner stem cutout so the 9 has a hollow tail -->
      <rect x="60" y="70" width="14" height="20" fill="black"/>
    </mask>
  </defs>

  <g mask="url(#nine-mask)">
    <!-- Upper half: lighter red -->
    <rect x="0" y="0" width="100" height="50" fill="#cf6768"/>
    <!-- Lower half: checker pattern -->
    <rect x="0" y="50" width="100" height="50" fill="url(#checker)"/>
  </g>
</svg>
