<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 700" width="1600" height="700" role="img" aria-label="Hero placeholder">
  <title>Hero placeholder</title>
  <desc>Single-color hero placeholder. Replace /public/hero-placeholder.svg with the final watercolor artwork.</desc>

  <defs>
    <linearGradient id="wash" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff7f7"/>
      <stop offset="100%" stop-color="#f5d0d1"/>
    </linearGradient>
  </defs>

  <!-- Solid pastel wash (single-color family) -->
  <rect width="1600" height="700" fill="url(#wash)"/>

  <!-- Single-color "leaves" silhouettes — purely decorative so the
       layout reads even before the real watercolor artwork is dropped in -->
  <g fill="#cf6768" opacity="0.45">
    <ellipse cx="120" cy="540" rx="200" ry="90"/>
    <ellipse cx="260" cy="620" rx="160" ry="70"/>
    <ellipse cx="1480" cy="180" rx="220" ry="100"/>
    <ellipse cx="1380" cy="300" rx="170" ry="80"/>
  </g>

  <!-- Tiny corner stamp (top-right) so a maintainer can spot the placeholder -->
  <g transform="translate(1540 56)" text-anchor="end" font-family="Inter, system-ui, sans-serif" fill="#8e211c" opacity="0.55">
    <text font-size="11" letter-spacing="2" font-weight="600">HERO PLACEHOLDER</text>
    <text y="14" font-size="9" fill="#514343">replace /public/hero-placeholder.svg</text>
  </g>
</svg>
